<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Base and Grid background */
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            background-image: 
                linear-gradient(#e5e5e5 1px, transparent 1px),
                linear-gradient(90deg, #e5e5e5 1px, transparent 1px);
            background-size: 50px 50px;
            font-family: 'Courier Prime', monospace;
            color: #111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Layout Container */
        .wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* The 404 card */
        .error-card {
            background: #f6f3eb; /* Paper-like color */
            padding: 50px 40px;
            box-shadow: 4px 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #dcd5c6;
            transform: rotate(-2deg);
            text-align: center;
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .error-code {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 5rem;
            color: #111;
            margin: 0;
            line-height: 1;
            letter-spacing: -3px;
        }

        .error-message {
            font-size: 1.2rem;
            margin: 0;
            color: #666;
        }

        /* Back button inside the card */
        .nav-item {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            text-transform: lowercase;
            text-decoration: none;
            color: #111;
            background: white;
            padding: 8px 15px;
            border: 1px solid #111;
            box-shadow: 2px 2px 0px #111;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            transform: rotate(2deg);
            margin-top: 10px;
        }

        .nav-item:hover {
            transform: translate(-2px, -2px) rotate(0deg) !important;
            box-shadow: 4px 4px 0px #111;
        }

        /* Footer */
        .site-footer {
            text-align: center;
            padding: 20px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            color: #666;
            letter-spacing: 1px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .error-card {
                padding: 40px 20px;
            }
            .error-code {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>

    <main class="wrapper">
        <!-- 404 Card -->
        <div class="error-card">
            <h1 class="error-code">404</h1>
            <p class="error-message">file not found.</p>
            <a href="index.html" class="nav-item">← back to archive</a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        antun rodriguez 2026.
    </footer>

</body>
</html>
